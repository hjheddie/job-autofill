<!doctype html>
<html><head><meta charset="utf-8"><title>Fixture: Greenhouse-style form</title></head>
<body>
<form id="application_form">
  <div class="field"><label for="first_name">First Name *</label><input id="first_name" name="first_name" type="text"></div>
  <div class="field"><label for="last_name">Last Name *</label><input id="last_name" name="last_name" type="text"></div>
  <div class="field"><label for="email">Email *</label><input id="email" name="email" type="text"></div>
  <div class="field"><label for="phone">Phone *</label><input id="phone" name="phone" type="text"></div>
  <div class="field"><label for="resume">Resume/CV</label><input id="resume" name="resume" type="file"></div>
  <div class="field"><label for="q1">LinkedIn Profile</label><input id="q1" name="question_1001" type="text"></div>
  <div class="field"><label for="q2">How did you hear about this job? *</label><input id="q2" name="question_1002" type="text"></div>
  <div class="field"><label for="q3">Are you legally authorized to work in the United States? *</label>
    <select id="q3" name="question_1003"><option value="">Please select</option><option value="1">Yes</option><option value="0">No</option></select></div>
  <fieldset><legend>Will you now or in the future require sponsorship? *</legend>
    <label><input type="radio" name="question_1004" value="1"> Yes</label>
    <label><input type="radio" name="question_1004" value="0"> No</label></fieldset>
  <div class="field"><label for="g">Gender</label>
    <select id="g" name="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Decline to Self Identify</option></select></div>
  <div class="field"><label for="x">Describe your favorite project</label><textarea id="x" name="question_1005"></textarea></div>
  <div data-automation-id="formField-addressLine1"><label for="address--addressLine1">Address Line 1</label>
    <input id="address--addressLine1" name="addressLine1" type="text"></div>
  <div data-automation-id="formField-countryRegion"><label for="address--countryRegion">State</label>
    <button id="address--countryRegion" type="button" aria-haspopup="listbox">Select One</button>
    <ul role="listbox"><li role="option">Indiana</li><li role="option">Illinois</li><li role="option">Iowa</li></ul></div>
  <div data-automation-id="formField-postalCode"><label for="address--postalCode">Postal Code</label>
    <input id="address--postalCode" name="postalCode" type="text"></div>
  <div class="field"><label for="st">State (native select)</label>
    <select id="st" name="st"><option value="">Select One</option><option>Illinois</option><option>IL - Other</option></select></div>
  <div class="field"><label for="co">Country</label>
    <select id="co" name="co"><option value="">Select One</option><option>United States of America</option><option>Canada</option></select></div>
</form>
</body></html>
