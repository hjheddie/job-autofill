<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 300px; margin: 0; padding: 14px; }
  button { width: 100%; padding: 9px; font-size: 14px; cursor: pointer; border: 0; border-radius: 6px; background: #2563eb; color: #fff; }
  label { display: block; font-size: 12px; color: #555; margin-bottom: 8px; }
  select { width: 100%; padding: 6px; margin-top: 3px; font-size: 13px; }
  button.link { background: none; color: #2563eb; padding: 6px 0 0; font-size: 12px; }
  #out { margin-top: 10px; }
  h4 { margin: 10px 0 4px; font-size: 12px; text-transform: uppercase; color: #666; }
  ul { margin: 0; padding-left: 18px; }
  .warn { color: #b45309; }
</style>
</head>
<body>
  <label>Profile <select id="profile"></select></label>
  <button id="fill">Fill this page</button>
  <button id="opts" class="link">Edit profile</button>
  <div id="out"></div>
  <script src="profiles.js"></script>
  <script src="popup.js"></script>
</body>
</html>
